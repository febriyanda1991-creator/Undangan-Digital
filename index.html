<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Undangan Pernikahan</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=Great+Vibes&family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;
 background:#111;
 color:#fff;
 font-family:"DM Sans",sans-serif;
 overflow-x:hidden;
}
button,a{font:inherit}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
section{position:relative}
.hidden{display:none!important}

/* =========================================================
   COMMON
========================================================= */
#app{min-height:100vh}
.page{min-height:100vh;overflow:hidden}
.container{width:min(1100px,92%);margin:auto}
.center{text-align:center}
.eyebrow{
 font-size:10px;
 letter-spacing:4px;
 text-transform:uppercase;
 opacity:.75;
}
.names{
 font-family:"Cormorant Garamond",serif;
 font-size:clamp(48px,12vw,105px);
 line-height:.78;
 font-weight:500;
}
.script{
 font-family:"Great Vibes",cursive;
}
.divider{
 width:70px;height:1px;margin:25px auto;
 background:currentColor;opacity:.5;
}
.btn{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 min-width:170px;
 padding:14px 22px;
 border:1px solid currentColor;
 border-radius:50px;
 background:transparent;
 color:inherit;
 cursor:pointer;
 transition:.3s;
}
.btn:hover{transform:translateY(-3px)}
.photo{
 width:100%;
 height:100%;
 object-fit:cover;
}
.reveal{
 opacity:0;
 transform:translateY(35px);
 transition:1s ease;
}
.reveal.show{
 opacity:1;
 transform:none;
}

/* =========================================================
   THEME 1 — BLACK GOLD LUXURY
========================================================= */
.t1{
 background:#090909;
 color:#f5ead0;
}
.t1 .hero{
 min-height:100svh;
 display:grid;
 place-items:center;
 position:relative;
}
.t1 .hero-photo{
 position:absolute;
 inset:0;
 opacity:.42;
}
.t1 .hero-photo img{
 width:100%;height:100%;object-fit:cover;
}
.t1 .hero:after{
 content:"";
 position:absolute;inset:0;
 background:
 linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.8)),
 radial-gradient(circle at center,transparent,rgba(0,0,0,.7));
}
.t1 .hero-content{
 position:relative;
 z-index:2;
 text-align:center;
 width:90%;
}
.t1 .monogram{
 width:90px;height:90px;
 border:1px solid #c9a86a;
 border-radius:50%;
 display:grid;place-items:center;
 margin:0 auto 30px;
 font-family:"Cormorant Garamond";
 font-size:28px;
 animation:goldPulse 3s infinite;
}
@keyframes goldPulse{
 50%{box-shadow:0 0 35px rgba(201,168,106,.25)}
}
.t1 .hero .names{color:#f0d49b}
.t1 .gold-line{
 width:130px;height:1px;background:#c9a86a;margin:35px auto;
}
.t1 .scroll{
 margin-top:80px;
 font-size:9px;letter-spacing:4px;opacity:.7;
 animation:bounce 2s infinite;
}
@keyframes bounce{
 50%{transform:translateY(8px)}
}
.t1 .section{
 padding:100px 0;
 background:#0b0b0b;
}
.t1 .couple{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:40px;
}
.t1 .person img{
 aspect-ratio:4/5;
 border:1px solid #b79555;
 padding:8px;
 object-fit:cover;
}
.t1 .person h2{
 font-family:"Cormorant Garamond";
 font-size:42px;
 font-weight:400;
}
.t1 .event-card{
 max-width:600px;margin:auto;
 border:1px solid #80673d;
 padding:50px 25px;
 text-align:center;
}
.t1 .gallery{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
}
.t1 .gallery img{aspect-ratio:1;object-fit:cover}

/* =========================================================
   THEME 2 — WHITE EDITORIAL
========================================================= */
.t2{
 background:#f8f7f3;
 color:#222;
}
.t2 .hero{
 min-height:100svh;
 display:flex;
 align-items:center;
}
.t2 .hero-layout{
 display:grid;
 grid-template-columns:1fr 1.25fr;
 min-height:100svh;
}
.t2 .hero-photo{
 order:2;
}
.t2 .hero-photo img{
 height:100%;object-fit:cover;
}
.t2 .hero-text{
 display:flex;
 flex-direction:column;
 justify-content:center;
 padding:10%;
}
.t2 .hero-text .names{
 font-family:"Playfair Display";
 font-size:clamp(42px,7vw,80px);
 line-height:1;
}
.t2 .amp{
 font-family:"Great Vibes";
 font-size:55px;
}
.t2 .section{
 padding:110px 0;
}
.t2 .story{
 max-width:680px;
 margin:auto;
 font-family:"Cormorant Garamond";
 font-size:25px;
 line-height:1.7;
}
.t2 .portrait{
 max-width:470px;
 margin:60px auto 0;
}
.t2 .portrait img{
 aspect-ratio:3/4;
 object-fit:cover;
}
.t2 .event{
 display:grid;
 grid-template-columns:1fr 1fr;
 max-width:850px;
 margin:auto;
 border-top:1px solid #bbb;
 border-bottom:1px solid #bbb;
}
.t2 .event>div{
 padding:45px 20px;
 text-align:center;
}
.t2 .event>div+div{border-left:1px solid #bbb}
.t2 .gallery{
 display:grid;
 grid-template-columns:2fr 1fr;
 gap:10px;
 max-width:850px;
 margin:auto;
}
.t2 .gallery img{height:100%;min-height:200px;object-fit:cover}
.t2 .gallery .tall{grid-row:span 2}

/* =========================================================
   THEME 3 — SAGE GARDEN
========================================================= */
.t3{
 background:#edf0e7;
 color:#334437;
}
.t3 .hero{
 min-height:100svh;
 display:grid;
 place-items:center;
 background:#dfe6d9;
}
.t3 .hero-photo{
 width:min(78vw,430px);
 height:min(105vw,580px);
 border-radius:220px 220px 25px 25px;
 overflow:hidden;
 box-shadow:0 30px 70px rgba(35,55,40,.18);
 position:absolute;
}
.t3 .hero-photo img{
 width:100%;height:100%;object-fit:cover;
}
.t3 .hero-content{
 position:relative;
 z-index:2;
 text-align:center;
 padding-top:550px;
}
.t3 .hero .names{
 font-size:clamp(55px,13vw,100px);
}
.t3 .leaf{
 position:absolute;
 font-size:55px;
 opacity:.35;
 animation:sway 4s ease-in-out infinite;
}
.t3 .l1{left:4%;top:15%}
.t3 .l2{right:4%;bottom:20%;animation-delay:1s}
@keyframes sway{
 50%{transform:rotate(12deg) translateY(-8px)}
}
.t3 .section{padding:100px 0}
.t3 .card{
 max-width:650px;
 margin:auto;
 background:rgba(255,255,255,.5);
 border-radius:30px;
 padding:45px 25px;
}
.t3 .couple{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:25px;
}
.t3 .person img{
 aspect-ratio:1;
 border-radius:50%;
 object-fit:cover;
}
.t3 .gallery{
 columns:2;
 column-gap:10px;
}
.t3 .gallery img{
 margin-bottom:10px;
 border-radius:18px;
}

/* =========================================================
   THEME 4 — FLORAL ROMANCE
========================================================= */
.t4{
 background:#fff5f5;
 color:#573d45;
}
.t4 .hero{
 min-height:100svh;
 display:grid;
 place-items:center;
}
.t4 .hero-frame{
 width:min(85vw,480px);
 height:min(110vw,620px);
 border-radius:50% 50% 8px 8px;
 overflow:hidden;
 position:absolute;
 box-shadow:0 20px 60px rgba(90,50,60,.2);
}
.t4 .hero-frame:after{
 content:"";
 position:absolute;inset:0;
 background:linear-gradient(180deg,transparent 50%,rgba(30,10,20,.6));
}
.t4 .hero-frame img{
 width:100%;height:100%;object-fit:cover;
}
.t4 .hero-content{
 position:relative;
 z-index:2;
 color:white;
 text-align:center;
 margin-top:430px;
}
.t4 .hero .names{
 font-family:"Great Vibes";
 font-size:clamp(60px,15vw,110px);
}
.t4 .petal{
 position:absolute;
 top:-30px;
 font-size:22px;
 animation:fall linear infinite;
 opacity:.7;
}
@keyframes fall{
 to{transform:translateY(110vh) rotate(360deg)}
}
.t4 .flower-card{
 background:white;
 margin:auto;
 max-width:700px;
 padding:50px 25px;
 border-radius:60px 12px 60px 12px;
 box-shadow:0 15px 50px rgba(80,40,50,.08);
}
.t4 .gallery{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:15px;
}
.t4 .gallery img{
 border-radius:70px 10px 70px 10px;
 aspect-ratio:4/5;
 object-fit:cover;
}

/* =========================================================
   THEME 5 — ACEH ROYAL
========================================================= */
.t5{
 background:#071d1b;
 color:#e9d39b;
}
.t5 .hero{
 min-height:100svh;
 display:grid;
 place-items:center;
 background:
 repeating-linear-gradient(45deg,transparent 0 25px,rgba(220,190,100,.04) 26px 27px);
}
.t5 .royal-frame{
 width:min(82vw,460px);
 height:min(108vw,600px);
 border:2px solid #c7a85e;
 padding:9px;
 position:absolute;
}
.t5 .royal-frame:before,
.t5 .royal-frame:after{
 content:"✦";
 position:absolute;
 font-size:40px;
 background:#071d1b;
 padding:8px;
}
.t5 .royal-frame:before{top:-28px;left:50%;transform:translateX(-50%)}
.t5 .royal-frame:after{bottom:-28px;left:50%;transform:translateX(-50%)}
.t5 .royal-frame img{
 width:100%;height:100%;object-fit:cover;
}
.t5 .hero-content{
 position:relative;
 z-index:2;
 text-align:center;
 margin-top:450px;
}
.t5 .hero .names{
 font-family:"Cormorant Garamond";
 color:#f1dca8;
}
.t5 .royal-section{
 padding:110px 0;
}
.t5 .royal-card{
 max-width:700px;
 margin:auto;
 border:1px solid #9f8247;
 padding:55px 30px;
 text-align:center;
 position:relative;
}
.t5 .royal-card:before{
 content:"۞";
 position:absolute;
 top:-25px;
 left:50%;
 transform:translateX(-50%);
 background:#071d1b;
 font-size:35px;
 padding:0 15px;
}
.t5 .gallery{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
}
.t5 .gallery img{aspect-ratio:4/5;object-fit:cover}

/* =========================================================
   THEME 6 — MIDNIGHT CINEMATIC
========================================================= */
.t6{
 background:#030408;
 color:#fff;
}
.t6 .hero{
 height:100svh;
 position:relative;
 overflow:hidden;
}
.t6 .hero-photo{
 position:absolute;inset:-5%;
 animation:cinemaZoom 14s ease-in-out infinite alternate;
}
.t6 .hero-photo img{
 width:100%;height:100%;object-fit:cover;
 filter:brightness(.5) contrast(1.08);
}
@keyframes cinemaZoom{
 to{transform:scale(1.08)}
}
.t6 .hero:after{
 content:"";
 position:absolute;inset:0;
 background:
 linear-gradient(90deg,rgba(0,0,0,.8),transparent 70%),
 linear-gradient(0deg,rgba(0,0,0,.8),transparent 60%);
}
.t6 .hero-content{
 position:absolute;
 left:8%;
 bottom:12%;
 z-index:2;
}
.t6 .hero .names{
 font-family:"Playfair Display";
 font-size:clamp(48px,9vw,100px);
}
.t6 .cinema-section{
 padding:110px 0;
}
.t6 .wide-photo{
 height:70vh;
 min-height:400px;
 position:relative;
 overflow:hidden;
}
.t6 .wide-photo img{object-fit:cover}
.t6 .overlay-text{
 position:absolute;
 left:30px;
 bottom:30px;
 font-family:"Playfair Display";
 font-size:45px;
}
.t6 .gallery{
 display:grid;
 grid-template-columns:1.5fr 1fr 1fr;
 gap:5px;
}
.t6 .gallery img{
 height:350px;
 object-fit:cover;
}

/* =========================================================
   THEME 7 — RUSTIC EARTHY
========================================================= */
.t7{
 background:#d8c6a7;
 color:#49382b;
}
.t7 .hero{
 min-height:100svh;
 padding:40px 20px;
 display:grid;
 place-items:center;
 background:
 radial-gradient(circle at 20% 20%,rgba(255,255,255,.2),transparent 30%);
}
.t7 .paper{
 background:#eee2ca;
 width:min(92vw,500px);
 padding:22px;
 transform:rotate(-1deg);
 box-shadow:10px 15px 40px rgba(50,30,10,.25);
 position:relative;
}
.t7 .paper-photo{
 height:60vh;
 min-height:420px;
}
.t7 .paper-photo img{object-fit:cover}
.t7 .paper-text{
 padding:35px 15px 25px;
 text-align:center;
}
.t7 .paper-text .names{
 font-family:"Great Vibes";
 font-size:65px;
}
.t7 .tape{
 position:absolute;
 width:100px;height:30px;
 background:rgba(190,170,130,.7);
 top:-12px;
 left:50%;
 transform:translateX(-50%) rotate(-3deg);
}
.t7 .section{padding:100px 0}
.t7 .wood-card{
 background:#eadcc1;
 padding:45px 25px;
 max-width:700px;
 margin:auto;
 box-shadow:5px 10px 30px rgba(60,40,20,.15);
}
.t7 .polaroids{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:25px;
}
.t7 .polaroid{
 background:white;
 padding:10px 10px 35px;
 box-shadow:3px 8px 20px rgba(50,30,10,.2);
}
.t7 .polaroid:nth-child(even){transform:rotate(3deg)}
.t7 .polaroid:nth-child(odd){transform:rotate(-2deg)}
.t7 .polaroid img{
 aspect-ratio:1;
 object-fit:cover;
}

/* =========================================================
   THEME 8 — ROYAL PURPLE GLAM
========================================================= */
.t8{
 background:#16091e;
 color:#f4e8fa;
}
.t8 .hero{
 min-height:100svh;
 display:grid;
 place-items:center;
 position:relative;
 overflow:hidden;
}
.t8 .orb{
 position:absolute;
 width:300px;height:300px;
 border-radius:50%;
 background:rgba(170,70,220,.18);
 filter:blur(60px);
 animation:orb 6s infinite alternate;
}
.t8 .orb1{top:5%;left:-100px}
.t8 .orb2{bottom:5%;right:-100px;animation-delay:2s}
@keyframes orb{
 to{transform:translate(50px,-30px) scale(1.2)}
}
.t8 .glam-photo{
 width:min(72vw,400px);
 height:min(95vw,550px);
 border-radius:220px 220px 30px 30px;
 overflow:hidden;
 position:absolute;
 box-shadow:0 0 80px rgba(180,80,230,.2);
}
.t8 .glam-photo img{width:100%;height:100%;object-fit:cover}
.t8 .hero-content{
 position:relative;
 z-index:2;
 text-align:center;
 margin-top:450px;
}
.t8 .hero .names{
 font-family:"Great Vibes";
 color:#f0c8ff;
}
.t8 .glam-card{
 max-width:750px;
 margin:auto;
 background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.025));
 border:1px solid rgba(255,255,255,.2);
 backdrop-filter:blur(15px);
 padding:55px 25px;
 border-radius:30px;
}
.t8 .gallery{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
}
.t8 .gallery img{
 aspect-ratio:3/4;
 object-fit:cover;
 border-radius:20px;
}

/* =========================================================
   THEME 9 — TROPICAL ROMANCE
========================================================= */
.t9{
 background:#eff4e8;
 color:#294737;
}
.t9 .hero{
 min-height:100svh;
 position:relative;
 display:flex;
 align-items:flex-end;
 overflow:hidden;
}
.t9 .hero-photo{
 position:absolute;
 inset:0;
}
.t9 .hero-photo img{
 width:100%;height:100%;object-fit:cover;
}
.t9 .hero:after{
 content:"";
 position:absolute;inset:0;
 background:linear-gradient(0deg,rgba(0,35,20,.8),transparent 65%);
}
.t9 .hero-content{
 position:relative;
 z-index:2;
 width:100%;
 padding:50px 8%;
 color:white;
}
.t9 .hero .names{
 font-family:"Great Vibes";
}
.t9 .leaf-strip{
 position:absolute;
 top:0;left:0;
 width:200%;
 height:90px;
 background:rgba(30,70,45,.7);
 transform:rotate(-2deg);
 animation:slideLeaves 15s linear infinite;
}
@keyframes slideLeaves{
 to{transform:translateX(-50%) rotate(-2deg)}
}
.t9 .tropical-section{padding:100px 0}
.t9 .event-tropical{
 display:flex;
 flex-direction:column;
 max-width:700px;
 margin:auto;
 gap:15px;
}
.t9 .tropical-box{
 background:#fff;
 border-radius:100px 20px 100px 20px;
 padding:40px 25px;
 text-align:center;
}
.t9 .gallery{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}
.t9 .gallery img{
 aspect-ratio:4/5;
 object-fit:cover;
 border-radius:80px 10px;
}

/* =========================================================
   THEME 10 — MODERN GLASS
========================================================= */
.t10{
 background:#0e1117;
 color:#fff;
 min-height:100vh;
}
.t10 .hero{
 min-height:100svh;
 position:relative;
 display:grid;
 place-items:center;
 overflow:hidden;
}
.t10 .hero-bg{
 position:absolute;inset:-20px;
 filter:blur(15px);
 transform:scale(1.08);
}
.t10 .hero-bg img{
 width:100%;height:100%;object-fit:cover;
}
.t10 .hero:after{
 content:"";
 position:absolute;inset:0;
 background:rgba(5,8,15,.48);
}
.t10 .glass-main{
 position:relative;
 z-index:2;
 width:min(88vw,520px);
 padding:55px 25px;
 border:1px solid rgba(255,255,255,.3);
 background:rgba(255,255,255,.1);
 backdrop-filter:blur(18px);
 border-radius:35px;
 text-align:center;
 box-shadow:0 30px 100px rgba(0,0,0,.35);
 animation:floatGlass 5s ease-in-out infinite;
}
@keyframes floatGlass{
 50%{transform:translateY(-10px)}
}
.t10 .glass-main .hero-photo{
 width:170px;height:220px;
 margin:0 auto 35px;
 border-radius:100px;
 overflow:hidden;
 border:1px solid rgba(255,255,255,.5);
}
.t10 .hero .names{
 font-family:"Playfair Display";
 font-size:48px;
}
.t10 .glass-section{
 padding:110px 0;
}
.t10 .glass-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:15px;
}
.t10 .glass-card{
 padding:35px 20px;
 border:1px solid rgba(255,255,255,.15);
 background:rgba(255,255,255,.06);
 backdrop-filter:blur(12px);
 border-radius:25px;
}
.t10 .gallery{
 display:grid;
 grid-template-columns:2fr 1fr;
 gap:10px;
}
.t10 .gallery img{
 width:100%;
 height:250px;
 object-fit:cover;
 border-radius:20px;
}

/* =========================================================
   COMMON CONTENT
========================================================= */
.common-info{
 padding:90px 0;
}
.quote{
 max-width:700px;
 margin:0 auto 60px;
 text-align:center;
 font-family:"Cormorant Garamond";
 font-size:25px;
 line-height:1.6;
}
.countdown{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
 max-width:600px;
 margin:35px auto;
}
.timebox{
 padding:18px 5px;
 border:1px solid currentColor;
 text-align:center;
}
.timebox b{
 display:block;
 font-size:28px;
}
.timebox span{
 font-size:9px;
 letter-spacing:2px;
 opacity:.7;
}
.parents{
 text-align:center;
 margin:40px auto;
}
.parents strong{
 display:block;
 font-family:"Cormorant Garamond";
 font-size:25px;
 margin:8px;
}
.actions{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:10px;
 margin:35px auto;
}
.map{
 width:100%;
 max-width:800px;
 height:300px;
 margin:30px auto;
 border:0;
}
.bank{
 max-width:500px;
 margin:30px auto;
 padding:25px;
 border:1px solid currentColor;
 text-align:center;
}
.bank-number{
 font-size:26px;
 letter-spacing:2px;
 margin:10px;
}
footer{
 padding:60px 20px;
 text-align:center;
 opacity:.7;
}
.music{
 position:fixed;
 right:18px;
 bottom:18px;
 z-index:100;
 width:48px;height:48px;
 border-radius:50%;
 border:1px solid currentColor;
 background:rgba(0,0,0,.35);
 color:white;
 backdrop-filter:blur(10px);
 cursor:pointer;
}
#opening{
 position:fixed;
 inset:0;
 z-index:999;
 display:grid;
 place-items:center;
 text-align:center;
 padding:25px;
}
#opening .open-inner{
 max-width:500px;
}
#opening .open-photo{
 width:180px;height:240px;
 margin:0 auto 30px;
 overflow:hidden;
}
#opening .open-photo img{
 width:100%;height:100%;object-fit:cover;
}
.open-button{
 margin-top:30px;
}
.t1 #opening{background:#090909;color:#f0d49b}
.t2 #opening{background:#f8f7f3;color:#222}
.t3 #opening{background:#dfe6d9;color:#334437}
.t4 #opening{background:#fff5f5;color:#573d45}
.t5 #opening{background:#071d1b;color:#e9d39b}
.t6 #opening{background:#030408;color:white}
.t7 #opening{background:#d8c6a7;color:#49382b}
.t8 #opening{background:#16091e;color:#f4e8fa}
.t9 #opening{background:#eff4e8;color:#294737}

 tanggal:"2026-12-20",
 jam:"19:00",
 lokasi:"Nama Gedung",

 maps:"",
 orangTuaPria:"Bapak & Ibu",
 orangTuaWanita:"Bapak & Ibu",
 whatsapp:"",
 bank:"Bank",
 rekening:"",
 pemilikRekening:"",
 fotoCover:"IMG_7063.jpeg",
 fotoPria:"IMG_7063.jpeg",
 fotoWanita:"IMG_7063.jpeg",
 foto1:"IMG_7063.jpeg",
 foto2:"IMG_7063.jpeg",
 foto3:"IMG_7063.jpeg",
 foto4:"IMG_7063.jpeg",
 musik:"",
 pesan:"Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu.",
 tema:"1"
};

/* =========================================================
   AMBIL DATA DARI LINK
========================================================= */

function ambilDataDariLink(){
 try{
  const hash=window.location.hash;
  if(!hash.startsWith("#data=")) return null;

  const json=decodeURIComponent(hash.substring(6));
  const data=JSON.parse(json);

  if(data && typeof data==="object"){
   localStorage.setItem("DATA_UNDANGAN",JSON.stringify(data));
   return data;
  }
 }catch(e){
  console.error("Data link tidak valid:",e);
 }
 return null;
}

function ambilData(){
 const linkData=ambilDataDariLink();

 if(linkData){
  return {...DEFAULT_DATA,...linkData};
 }

 try{
  const local=localStorage.getItem("DATA_UNDANGAN");
  if(local){
   return {...DEFAULT_DATA,...JSON.parse(local)};
  }
 }catch(e){}

 return DEFAULT_DATA;
}

const DATA=ambilData();

/* =========================================================
   FOTO GITHUB
========================================================= */

const GITHUB_RAW =
"https://raw.githubusercontent.com/febriyanda1991-creator/Undangan-Digital/main/";

function fotoURL(nama){
 if(!nama) return GITHUB_RAW+"IMG_7063.jpeg";

 nama=String(nama).trim();

 /* jika sudah URL */
 if(/^https?:\/\//i.test(nama)) return nama;

 /* admin kadang menyimpan nama tanpa extension */
 const extensi=/\.(jpg|jpeg|png|webp|gif)$/i.test(nama)
  ? ""
  : ".jpeg";

 return GITHUB_RAW+encodeURIComponent(nama)+extensi;
}

/* =========================================================
   FORMAT
========================================================= */

function formatTanggal(tanggal){
 if(!tanggal) return "";

 const d=new Date(tanggal+"T00:00:00");

 if(isNaN(d)) return tanggal;

 return d.toLocaleDateString("id-ID",{
  weekday:"long",
  day:"numeric",
  month:"long",
  year:"numeric"
 });
}

function bersihkanJam(jam){
 if(!jam) return "19:00";

 let s=String(jam)
  .replace(/WIB/gi,"")
  .replace(/WITA/gi,"")
  .replace(/WIT/gi,"")
  .trim();

 const match=s.match(/\d{1,2}[:.]\d{2}/);

 return match ? match[0].replace(".",":") : "19:00";
}

function whatsappURL(){
 let nomor=String(DATA.whatsapp||"").replace(/\D/g,"");

 if(nomor.startsWith("0")) nomor="62"+nomor.substring(1);

 if(!nomor) return "#";

 const pesan=
 `Halo ${DATA.pria} & ${DATA.wanita}, saya ingin mengkonfirmasi kehadiran.`;

 return `https://wa.me/${nomor}?text=${encodeURIComponent(pesan)}`;
}

/* =========================================================
   TEMA
========================================================= */

let tema=parseInt(DATA.tema)||1;

if(tema<1 || tema>10) tema=1;

document.body.className="t"+tema;

/* =========================================================
   GALERI
========================================================= */

function galleryHTML(){
 const fotos=[
  DATA.foto1,
  DATA.foto2,
  DATA.foto3,
  DATA.foto4
 ].filter(Boolean);

 if(!fotos.length){
  fotos.push(DATA.fotoCover);
 }

 return fotos.map((f,i)=>`
   <img
    src="${fotoURL(f)}"
    alt="Foto ${i+1}"
    loading="lazy"
    onerror="this.src='${fotoURL(DATA.fotoCover)}'"
   >
 `).join("");
}

/* =========================================================
   OPENING
========================================================= */

function bukaUndangan(){

 const opening=document.getElementById("opening");

 if(!opening) return;

 opening.style.transition="opacity .8s ease";
 opening.style.opacity="0";

 setTimeout(()=>{
  opening.remove();
  window.scrollTo(0,0);
 },800);

}

/* =========================================================
   REVEAL ANIMATION
========================================================= */

function initReveal(){

 const items=document.querySelectorAll(".reveal");

 const observer=new IntersectionObserver(entries=>{

  entries.forEach(entry=>{

   if(entry.isIntersecting){
    entry.target.classList.add("show");
   }

  });

 },{threshold:.12});

 items.forEach(item=>observer.observe(item));

}

/* =========================================================
   COUNTDOWN
========================================================= */

function initCountdown(){

 const target=new Date(
  `${DATA.tanggal}T${bersihkanJam(DATA.jam)}:00+07:00`
 ).getTime();

 function update(){

  const now=Date.now();
  let distance=target-now;

  if(distance<0) distance=0;

  const days=Math.floor(distance/(1000*60*60*24));

  const hours=Math.floor(
   (distance%(1000*60*60*24))/(1000*60*60)
  );

  const minutes=Math.floor(
   (distance%(1000*60*60))/(1000*60)
  );

  const seconds=Math.floor(
   (distance%(1000*60))/1000
  );

  const d=document.getElementById("days");
  const h=document.getElementById("hours");
  const m=document.getElementById("minutes");
  const s=document.getElementById("seconds");

  if(d)d.textContent=days;
  if(h)h.textContent=hours;
  if(m)m.textContent=minutes;
  if(s)s.textContent=seconds;
 }

 update();

 setInterval(update,1000);
}

   COPY REKENING
========================================================= */

function copyRekening(){

 if(!DATA.rekening) return;

 navigator.clipboard.writeText(DATA.rekening)
 .then(()=>{
  alert("Nomor rekening berhasil disalin.");
 })
 .catch(()=>{
  prompt("Salin nomor rekening:",DATA.rekening);
 });

}

/* =========================================================
   MUSIC
========================================================= */

let audio=null;
let musicPlaying=false;

function initMusic(){

 if(!DATA.musik) return;

 audio=new Audio(fotoURL(DATA.musik));
 audio.loop=true;
 audio.preload="auto";

 const button=document.createElement("button");

 button.className="music";
 button.id="musicButton";
 button.innerHTML="♫";

 button.onclick=()=>{

  if(!audio) return;

  if(musicPlaying){

   audio.pause();
   musicPlaying=false;
   button.innerHTML="♫";

  }else{

   audio.play()
   .then(()=>{
    musicPlaying=true;
    button.innerHTML="Ⅱ";
   })
   .catch(()=>{
    alert("Musik belum bisa diputar. Coba tekan lagi.");
   });

  }

 };

 document.body.appendChild(button);
}
