<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#f6f1e9">

<title>Wedding Invitation</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap');

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#eee9e1;
  color:#3b3936;
  font-family:'Montserrat',sans-serif;
  overflow-x:hidden;
}

body.locked{
  overflow:hidden;
}

img{
  display:block;
  width:100%;
}

button{
  font-family:inherit;
}

:root{
  --cream:#f4efe7;
  --paper:#faf7f1;
  --brown:#6f6255;
  --dark:#292723;
  --gold:#aa8a5c;
  --line:rgba(70,60,50,.18);
}

.page{
  width:100%;
  overflow:hidden;
}

.container{
  width:min(1050px,90%);
  margin:auto;
}

section{
  position:relative;
  padding:90px 0;
}

.serif{
  font-family:'Cormorant Garamond',serif;
}

.script{
  font-family:'Playfair Display',serif;
  font-style:italic;
}

.small-title{
  font-size:10px;
  letter-spacing:4px;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:15px;
}

.section-title{
  text-align:center;
  margin-bottom:45px;
}

.section-title h2{
  font-family:'Cormorant Garamond',serif;
  font-size:52px;
  font-weight:400;
  color:#38332d;
}

.section-title p{
  max-width:600px;
  margin:15px auto 0;
  line-height:1.9;
  font-size:12px;
  color:#777066;
}

/* =================================
   OPENING
================================= */

.opening{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#e9e0d4;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:1s ease;
}

.opening.hide{
  opacity:0;
  visibility:hidden;
  transform:scale(1.04);
}

.opening-photo{
  position:absolute;
  inset:0;
}

.opening-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(.58);
}

.opening-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(20,15,10,.1),
    rgba(20,15,10,.7)
  );
}

.envelope-box{
  position:relative;
  z-index:2;
  width:min(420px,88%);
  text-align:center;
  color:#fff;
}

.envelope-box .top-label{
  letter-spacing:5px;
  font-size:10px;
  margin-bottom:25px;
}

.envelope-box h1{
  font-family:'Cormorant Garamond',serif;
  font-size:60px;
  line-height:.9;
  font-weight:400;
}

.envelope-box h1 span{
  font-size:30px;
  display:block;
  margin:10px 0;
}

.dear{
  margin-top:40px;
  font-size:11px;
  letter-spacing:3px;
}

.guest-name{
  margin-top:8px;
  font-family:'Cormorant Garamond',serif;
  font-size:28px;
}

.open-envelope{
  margin-top:35px;
  padding:13px 28px;
  border:1px solid rgba(255,255,255,.7);
  background:rgba(255,255,255,.12);
  color:#fff;
  border-radius:2px;
  cursor:pointer;
  letter-spacing:2px;
  font-size:10px;
  backdrop-filter:blur(5px);
}

.open-envelope:hover{
  background:#fff;
  color:#333;
}

/* =================================
   HERO
================================= */

.hero{
  height:100vh;
  min-height:700px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  text-align:center;
  color:#fff;
  overflow:hidden;
}

.hero-image{
  position:absolute;
  inset:0;
}

.hero-image img{
  height:100%;
  object-fit:cover;
  filter:brightness(.62);
  animation:heroZoom 12s ease-in-out infinite alternate;
}

@keyframes heroZoom{
  from{transform:scale(1);}
  to{transform:scale(1.08);}
}

.hero-overlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.08) 25%,
      rgba(0,0,0,.7) 100%
    );
}

.hero-content{
  position:relative;
  z-index:2;
  padding:50px 20px 90px;
}

.hero-content .small{
  font-size:10px;
  letter-spacing:6px;
  margin-bottom:25px;
}

.hero-content h1{
  font-family:'Cormorant Garamond',serif;
  font-weight:400;
  font-size:clamp(58px,10vw,110px);
  line-height:.78;
}

.hero-content h1 span{
  font-size:.38em;
  display:block;
  margin:14px 0;
}

.hero-date{
  margin-top:30px;
  font-size:11px;
  letter-spacing:4px;
}

/* =================================
   INTRO
================================= */

.intro{
  background:var(--paper);
  text-align:center;
}

.bismillah{
  font-family:serif;
  font-size:30px;
  margin-bottom:28px;
}

.intro h2{
  font-family:'Cormorant Garamond',serif;
  font-size:42px;
  font-weight:400;
  margin-bottom:20px;
}

.intro p{
  max-width:650px;
  margin:auto;
  font-size:12px;
  line-height:2;
  color:#777;
}

/* =================================
   COUPLE
================================= */

.couple{
  background:#eee7dd;
}

.couple-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:70px;
  align-items:start;
}

.person{
  text-align:center;
}

.person-photo{
  width:260px;
  height:350px;
  margin:auto;
  overflow:hidden;
  position:relative;
}

.person-photo:after{
  content:"";
  position:absolute;
  inset:12px;
  border:1px solid rgba(255,255,255,.7);
  pointer-events:none;
}

.person-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.7s;
}

.person:hover .person-photo img{
  transform:scale(1.05);
}

.person-name{
  font-family:'Cormorant Garamond',serif;
  font-size:38px;
  margin-top:22px;
}

.person-role{
  font-size:9px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#958675;
  margin:7px 0 15px;
}

.person-parents{
  font-size:11px;
  line-height:1.8;
  color:#777;
}

/* =================================
   COUNTDOWN
================================= */

.countdown-section{
  background:#faf7f1;
  text-align:center;
}

.countdown{
  max-width:700px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.count-item{
  padding:25px 5px;
  border-right:1px solid var(--line);
}

.count-item:last-child{
  border-right:0;
}

.count-number{
  font-family:'Cormorant Garamond',serif;
  font-size:43px;
}

.count-label{
  margin-top:5px;
  font-size:8px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#999;
}

/* =================================
   SAVE DATE
================================= */

.save-date{
  background:#e6ddd0;
}

.save-layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:50px;
  align-items:center;
}

.calendar{
  background:#f9f5ee;
  padding:35px;
  text-align:center;
  box-shadow:0 20px 50px rgba(50,40,30,.08);
}

.calendar-month{
  font-family:'Cormorant Garamond',serif;
  font-size:30px;
  margin-bottom:25px;
}

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
  font-size:10px;
}

.calendar-grid div{
  padding:5px;
}

.calendar-grid .active{
  border-radius:50%;
  background:#6e6153;
  color:#fff;
}

.event-info{
  text-align:center;
}

.event-type{
  font-size:10px;
  letter-spacing:4px;
  color:var(--gold);
}

.event-info h3{
  font-family:'Cormorant Garamond',serif;
  font-size:44px;
  font-weight:400;
  margin:10px 0;
}

.event-info p{
  font-size:12px;
  line-height:2;
  color:#756d64;
}

.maps{
  display:inline-block;
  margin-top:20px;
  padding:12px 25px;
  border:1px solid #75695c;
  color:#544b42;
  text-decoration:none;
  font-size:9px;
  letter-spacing:2px;
}

/* =================================
   GALLERY
================================= */

.gallery-section{
  background:#f8f5ef;
}

.gallery-intro{
  max-width:650px;
  margin:-15px auto 50px;
  text-align:center;
  font-family:'Playfair Display',serif;
  font-style:italic;
  line-height:2;
  color:#716960;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:14px;
}

.gallery-item{
  overflow:hidden;
  position:relative;
}

.gallery-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:1s ease;
}

.gallery-item:hover img{
  transform:scale(1.06);
}

.g1{
  grid-column:1 / 6;
  height:440px;
}

.g2{
  grid-column:6 / 13;
  height:300px;
}

.g3{
  grid-column:6 / 9;
  height:300px;
}

.g4{
  grid-column:9 / 13;
  height:300px;
}

.gallery-quote{
  grid-column:1 / 6;
  min-height:300px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:35px;
  text-align:center;
  background:#e8dfd3;
  font-family:'Playfair Display',serif;
  font-style:italic;
  line-height:2;
  font-size:14px;
}

.gallery-bottom{
  margin-top:14px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.gallery-bottom .gallery-item{
  height:350px;
}

/* =================================
   STORY
================================= */

.story{
  background:#e7ded2;
  text-align:center;
}

.story-inner{
  max-width:700px;
  margin:auto;
}

.story p{
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-size:15px;
  line-height:2.2;
  color:#696056;
}

/* =================================
   GIFT
================================= */

.gift{
  background:#f8f4ec;
  text-align:center;
}

.gift-intro{
  max-width:550px;
  margin:-15px auto 35px;
  line-height:2;
  font-size:11px;
  color:#81786e;
}

.bank-card{
  max-width:420px;
  margin:auto;
  background:#eee6da;
  padding:35px;
  position:relative;
}

.bank-name{
  font-size:11px;
  letter-spacing:4px;
  text-transform:uppercase;
}

.account-number{
  font-family:'Cormorant Garamond',serif;
  font-size:32px;
  margin:18px 0 5px;
}

.account-owner{
  font-size:10px;
  color:#777;
}

.copy-button{
  margin-top:22px;
  padding:11px 25px;
  background:#665a4e;
  color:#fff;
  border:0;
  font-size:9px;
  letter-spacing:2px;
}

/* =================================
   WISHES
================================= */

.wishes{
  background:#e9e1d6;
}

.wishes-form{
  max-width:600px;
  margin:auto;
}

.form-input,
.form-select,
.form-textarea{
  width:100%;
  padding:15px;
  margin-bottom:12px;
  border:1px solid rgba(70,60,50,.2);
  background:#faf8f3;
  outline:none;
  font-family:inherit;
  font-size:11px;
}

.form-textarea{
  min-height:120px;
  resize:vertical;
}

.send-wish{
  width:100%;
  padding:15px;
  background:#63584d;
  color:#fff;
  border:0;
  letter-spacing:2px;
  font-size:9px;
}

.wish-counter{
  text-align:center;
  margin:25px 0;
  font-size:10px;
  color:#777;
}

.wishes-list{
  max-width:650px;
  margin:35px auto 0;
}

.wish{
  background:#f8f5ef;
  padding:18px;
  margin-bottom:10px;
  border-left:2px solid #ad956f;
}

.wish strong{
  font-size:11px;
}

.wish span{
  display:block;
  font-size:10px;
  color:#999;
  margin:5px 0 10px;
}

.wish p{
  font-size:11px;
  line-height:1.8;
}

/* =================================
   CLOSING
================================= */

.closing{
  min-height:700px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
}

.closing-bg{
  position:absolute;
  inset:0;
}

.closing-bg img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(.5);
}

.closing-overlay{
  position:absolute;
  inset:0;
  background:rgba(30,25,20,.35);
}

.closing-content{
  position:relative;
  z-index:2;
  max-width:700px;
  padding:30px;
}

.closing-content h2{
  font-family:'Cormorant Garamond',serif;
  font-size:58px;
  font-weight:400;
  line-height:1;
}

.closing-content p{
  margin:25px auto;
  max-width:550px;
  line-height:2;
  font-size:11px;
}

.closing-names{
  font-family:'Cormorant Garamond',serif;
  font-size:38px;
}

/* =================================
   MUSIC
================================= */

.music-button{
  position:fixed;
  right:18px;
  bottom:18px;
  width:45px;
  height:45px;
  border-radius:50%;
  background:rgba(70,60,50,.85);
  color:#fff;
  z-index:100;
  font-size:15px;
}

/* =================================
   ANIMATION
================================= */

.reveal{
  opacity:0;
  transform:translateY(35px);
  transition:1s ease;
}

.reveal.show{
  opacity:1;
  transform:translateY(0);
}

/* =================================
   MOBILE
================================= */

@media(max-width:700px){

  section{
    padding:70px 0;
  }

  .hero{
    min-height:680px;
  }

  .hero-content{
    padding-bottom:70px;
  }

  .hero-content h1{
    font-size:68px;
  }

  .opening h1{
    font-size:55px;
  }

  .couple-grid{
    grid-template-columns:1fr;
    gap:55px;
  }

  .person-photo{
    width:230px;
    height:315px;
  }

  .countdown{
    grid-template-columns:repeat(2,1fr);
  }

  .count-item:nth-child(2){
    border-right:0;
  }

  .count-item:nth-child(-n+2){
    border-bottom:1px solid var(--line);
  }

  .save-layout{
    grid-template-columns:1fr;
  }

  .gallery{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .g1,
  .g2,
  .g3,
  .g4{
    grid-column:auto;
    height:230px;
  }

  .gallery-quote{
    grid-column:1 / 3;
    min-height:230px;
  }

  .gallery-bottom{
    grid-column:1 / 3;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .gallery-bottom .gallery-item{
    height:230px;
  }

  .section-title h2{
    font-size:43px;
  }

  .closing-content h2{
    font-size:48px;
  }

}
</style>
</head>

<body class="locked">

<div id="app"></div>

<button
  id="musicButton"
  class="music-button"
  style="display:none"
>
  ♪
</button>

<script>

/* =========================================================
   DEFAULT DATA
========================================================= */

const DEFAULT_DATA = {

  idPelanggan:"demo",

  pria:"Naupal",

  wanita:"Annisa",

  tanggal:"2026-12-20",

  jam:"09:00",

  lokasi:"Tempat Acara",

  alamat:"Alamat acara pernikahan",

  maps:"",

  orangTuaPria:"Bapak & Ibu",

  orangTuaWanita:"Bapak & Ibu",

  whatsapp:"",

  bank:"BSI",

  rekening:"0000000000",

  pemilikRekening:"Nama Pemilik",

  fotoCover:"Prewedding idea.jpeg",

  fotoPria:"Unknown 4.jpeg",

  fotoWanita:"Unknown 5.jpeg",

  foto1:"Unknown 6.jpeg",

  foto2:"Unknown 7.jpeg",

  foto3:"Prewedding idea.jpeg",

  foto4:"Unknown 4.jpeg",

  musik:"",

  pesan:"Merupakan suatu kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu.",

  tema:"1"

};


/* =========================================================
   GITHUB
========================================================= */

const GITHUB_RAW =
"https://raw.githubusercontent.com/febriyanda1991-creator/Undangan-Digital/main/";


function fotoURL(nama){

  if(!nama) return "";

  let value = String(nama).trim();

  if(
    value.startsWith("http://") ||
    value.startsWith("https://") ||
    value.startsWith("data:")
  ){
    return value;
  }

  return GITHUB_RAW +
    encodeURIComponent(value);
}


/* =========================================================
   DATA DARI HASH
========================================================= */

function getLinkData(){

  try{

    const hash =
      window.location.hash;

    if(!hash.startsWith("#data=")){
      return null;
    }

    const encoded =
      hash.substring(6);

    const json =
      decodeURIComponent(encoded);

    return JSON.parse(json);

  }catch(error){

    console.error(error);

    return null;

  }

}


/* =========================================================
   DATA DARI LOCAL STORAGE
========================================================= */

function getSavedData(){

  try{

    const saved =
      localStorage.getItem(
        "DATA_UNDANGAN"
      );

    if(!saved) return null;

    return JSON.parse(saved);

  }catch(error){

    return null;

  }

}


/* =========================================================
   DATA UTAMA
========================================================= */

const LINK_DATA =
  getLinkData();

let DATA;

if(LINK_DATA){

  DATA = {
    ...DEFAULT_DATA,
    ...LINK_DATA
  };

  localStorage.setItem(
    "DATA_UNDANGAN",
    JSON.stringify(DATA)
  );

}else{

  const saved =
    getSavedData();

  DATA = saved
    ? {
        ...DEFAULT_DATA,
        ...saved
      }
    : {
        ...DEFAULT_DATA
      };

}


/* =========================================================
   NAMA TAMU ?to=
========================================================= */

function getGuestName(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const guest =
    params.get("to");

  if(!guest){
    return "Tamu Undangan";
  }

  return guest
    .replace(/\+/g," ")
    .trim();

}


/* =========================================================
   TANGGAL
========================================================= */

function dateObject(){

  return new Date(
    DATA.tanggal +
    "T" +
    (DATA.jam || "00:00") +
    ":00"
  );

}


function formatTanggal(){

  if(!DATA.tanggal){
    return "";
  }

  const d =
    new Date(
      DATA.tanggal +
      "T00:00:00"
    );

  return d.toLocaleDateString(
    "id-ID",
    {
      weekday:"long",
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );

}


function formatShortDate(){

  if(!DATA.tanggal){
    return "";
  }

  const d =
    new Date(
      DATA.tanggal +
      "T00:00:00"
    );

  return d.toLocaleDateString(
    "id-ID",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}


/* =========================================================
   OPENING
========================================================= */

function openingHTML(){

  return `

    <div
      id="opening"
      class="opening"
    >

      <div class="opening-photo">

        <img
          src="${fotoURL(DATA.fotoCover)}"
          alt="Cover"
          onerror="this.style.display='none'"
        >

      </div>

      <div class="opening-overlay"></div>


      <div class="envelope-box">

        <div class="top-label">
          THE WEDDING OF
        </div>

        <h1>

          ${escapeHTML(DATA.pria)}

          <span>&</span>

          ${escapeHTML(DATA.wanita)}

        </h1>


        <div class="dear">
          DEAR
        </div>


        <div class="guest-name">
          ${escapeHTML(getGuestName())}
        </div>


        <button
          class="open-envelope"
          onclick="openInvitation()"
        >
          PRESS THE ENVELOPE TO OPEN
        </button>

      </div>

    </div>

  `;

}


/* =========================================================
   HERO
========================================================= */

function heroHTML(){

  return `

    <section class="hero">

      <div class="hero-image">

        <img
          src="${fotoURL(DATA.fotoCover)}"
          alt="Foto utama"
          onerror="this.style.display='none'"
        >

      </div>


      <div class="hero-overlay"></div>


      <div class="hero-content reveal">

        <div class="small">
          WE ARE
          <br>
          GETTING MARRIED
        </div>


        <h1>

          ${escapeHTML(DATA.pria)}

          <span>&</span>

          ${escapeHTML(DATA.wanita)}

        </h1>


        <div class="hero-date">

          ${formatShortDate()}

        </div>

      </div>

    </section>

  `;

}


/* =========================================================
   INTRO
========================================================= */

function introHTML(){

  return `

    <section class="intro">

      <div class="container reveal">

        <div class="bismillah">
          بسم الله الرحمن الرحيم
        </div>

        <h2>
          Assalaamu'alaikum wr wb
        </h2>

/* =========================================================
   CALENDAR
========================================================= */

function calendarHTML(){

  const d =
    new Date(
      DATA.tanggal +
      "T00:00:00"
    );

  const year =
    d.getFullYear();

  const month =
    d.getMonth();

  const day =
    d.getDate();

  const monthName =
    d.toLocaleDateString(
      "id-ID",
      {
        month:"long"
      }
    );

  const first =
    new Date(
      year,
      month,
      1
    ).getDay();

  const mondayStart =
    first === 0
      ? 6
      : first - 1;

  const daysInMonth =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  let html = "";

  const labels =
    [
      "S",
      "S",
      "R",
      "K",
      "J",
      "S",
      "M"
    ];


  labels.forEach(x=>{
    html += `
      <div style="
        font-size:8px;
        color:#999;
      ">
        ${x}
      </div>
    `;
  });


  for(
    let i=0;
    i<mondayStart;
    i++
  ){

    html += `<div></div>`;

  }


  for(
    let i=1;
    i<=daysInMonth;
    i++
  ){

    html += `

      <div
        class="${i === day ? "active" : ""}"
      >
        ${i}
      </div>

    `;

  }


  return `

    <div class="calendar">

      <div class="calendar-month">
        ${monthName} ${year}
      </div>

      <div class="calendar-grid">

        ${html}

      </div>

    </div>

  `;

}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

  if(value === undefined || value === null){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHTML(value);

}

/* =========================================================
   COUNTDOWN
========================================================= */

function startCountdown(){

  const target =
    dateObject().getTime();


  function update(){

    let diff =
      target - Date.now();


    if(diff < 0){
      diff = 0;
    }


    const days =
      Math.floor(
        diff / 86400000
      );


    const hours =
      Math.floor(
        (diff % 86400000) /
        3600000
      );


    const minutes =
      Math.floor(
        (diff % 3600000) /
        60000
      );


    const seconds =
      Math.floor(
        (diff % 60000) /
        1000
      );


    const d =
      document.getElementById("days");

    const h =
      document.getElementById("hours");

    const m =
      document.getElementById("minutes");

    const s =
      document.getElementById("seconds");


    if(d) d.textContent = days;

    if(h) h.textContent =
      String(hours).padStart(2,"0");

    if(m) m.textContent =
      String(minutes).padStart(2,"0");

    if(s) s.textContent =
      String(seconds).padStart(2,"0");

  }


  update();

  setInterval(
    update,
    1000
  );

}

function copyRekening(){

  const nomor =
    DATA.rekening || "";

  if(!nomor) return;


  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard
      .writeText(nomor)
      .then(()=>{

        alert(
          "Nomor rekening berhasil disalin."
        );

      });

  }else{

    alert(
      "Nomor rekening: " +
      nomor
    );

  }

}

/* =========================================================
   WISHES
   LOCAL STORAGE UNTUK PROTOTYPE
========================================================= */

function wishesKey(){

  return "UCAPAN_" +
    (
      DATA.idPelanggan ||
      DATA.pria +
      DATA.wanita
    );

}


function getWishes(){

  try{

    return JSON.parse(
      localStorage.getItem(
        wishesKey()
      ) || "[]"
    );

  }catch(e){

    return [];

  }

}


function saveWishes(list){

  localStorage.setItem(
    wishesKey(),
    JSON.stringify(list)
  );

}


function sendWish(){

  const name =
    document
      .getElementById("wishName")
      .value
      .trim();


  const status =
    document
      .getElementById("wishStatus")
      .value;


  const message =
    document
      .getElementById("wishMessage")
      .value
      .trim();


  if(!name || !message){

    alert(
      "Nama dan ucapan wajib diisi."
    );

    return;

  }


  const list =
    getWishes();


  list.unshift({

    name:name,

    status:status,

    message:message,

    time:new Date()
      .toLocaleString("id-ID")

  });


  saveWishes(list);


  document
    .getElementById("wishName")
    .value = "";


  document
    .getElementById("wishMessage")
    .value = "";


  renderWishes();

}


/* =========================================================
   RENDER WISHES
========================================================= */

function renderWishes(){

  const list =
    getWishes();


  let hadir = 0;

  let tidak = 0;


  list.forEach(item=>{

    if(item.status === "Hadir"){
      hadir++;
    }else{
      tidak++;
    }

  });


  const hadirEl =
    document.getElementById(
      "hadirCount"
    );


  const tidakEl =
    document.getElementById(
      "tidakCount"
    );


  if(hadirEl){
    hadirEl.textContent =
      hadir;
  }


  if(tidakEl){
    tidakEl.textContent =
      tidak;
  }


  const container =
    document.getElementById(
      "wishesList"
    );


  if(!container) return;


  if(!list.length){

    container.innerHTML = "";

    return;

  }


  container.innerHTML =
    list
      .slice(0,30)
      .map(item=>`

        <div class="wish">

          <strong>
            ${escapeHTML(item.name)}
          </strong>

          <span>
            ${escapeHTML(item.status)}
            ·
            ${escapeHTML(item.time)}
          </span>

          <p>
            ${escapeHTML(item.message)}
          </p>

        </div>

      `)
      .join("");

}


/* =========================================================
   SCROLL REVEAL
========================================================= */

function setupReveal(){

  const observer =
    new IntersectionObserver(
      entries=>{

        entries.forEach(entry=>{

          if(entry.isIntersecting){

            entry.target.classList.add(
              "show"
            );

          }

        });

      },
      {
        threshold:.12
      }
    );


  document
    .querySelectorAll(".reveal")
    .forEach(el=>{

      observer.observe(el);

    });

}


/* =========================================================
   START
========================================================= */

render();

startCountdown();

renderWishes();

setupReveal();

</script>
